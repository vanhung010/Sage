spring.application.name=saga-res

# ===============================
# DATABASE
# ===============================
#spring.datasource.url=jdbc:postgresql://db.zzvxrnhsvujhwcjjrhrn.supabase.co:5432/postgres?sslmode=require
spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres
#spring.datasource.username=postgres
spring.datasource.username=postgres.zzvxrnhsvujhwcjjrhrn
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false


spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true

# ===============================
# JWT
# ===============================
security.jwt.issuer=saga-res
security.jwt.access-token-ttl=1h
security.jwt.secret=${JWT_SECRET}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from=${MAIL_USERNAME}


# ===============================
# CLOUDINARY
# ===============================
cloudinary.cloud-name: ${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key: ${CLOUDINARY_API_KEY}
cloudinary.api-secret: ${CLOUDINARY_API_SECRET}