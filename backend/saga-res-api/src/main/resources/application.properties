spring.application.name=saga-res

# ===============================
# DATABASE
# ===============================
spring.datasource.url=jdbc:postgresql://db.zzvxrnhsvujhwcjjrhrn.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Không b?t bu?c, nh?ng h?u ích khi debug development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY
# ===============================
spring.flyway.enabled=true

# ===============================
# JWT
# ===============================
security.jwt.issuer=saga-res
security.jwt.access-token-ttl=1h
security.jwt.secret=${JWT_SECRET}
